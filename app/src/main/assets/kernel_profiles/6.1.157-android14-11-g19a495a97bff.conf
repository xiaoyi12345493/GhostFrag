release = "6.1.157-android14-11-g19a495a97bff"
# QCOM firmware loads the image at 0xa8080000, one 0x80000 step above the
# 0xa8000000 default. Without this override W1 lands 0x80000 low and fails
# verification (and can trigger a watchdog reboot).
kernel_phys_load = 2819096576   # 0xa8080000
kernel_phys_offset = null       # Qualcomm default 0x80000000
