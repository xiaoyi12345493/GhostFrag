      consumer_burst_calls = 1
      enter_delay_us = 50000
    }
    tcp_zerocopy {
      arm_sequence = 16
      post_receive_hold_iterations = 20000
      attempts = 2000
    }
  }
  selected_cpus {
    main = 4
    consumer = 5
  }
}
